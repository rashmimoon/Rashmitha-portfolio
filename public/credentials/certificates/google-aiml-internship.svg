<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#certBg)" rx="16" />
  <rect x="20" y="20" width="760" height="510" fill="none" stroke="url(#goldBorder)" stroke-width="2" rx="12" />
  <rect x="28" y="28" width="744" height="494" fill="none" stroke="#1e293b" stroke-width="1" rx="8" />

  <!-- Corner Ornaments -->
  <circle cx="40" cy="40" r="6" fill="#f59e0b" />
  <circle cx="760" cy="40" r="6" fill="#f59e0b" />
  <circle cx="40" cy="510" r="6" fill="#f59e0b" />
  <circle cx="760" cy="510" r="6" fill="#f59e0b" />

  <!-- Badge Top Icon -->
  <g transform="translate(370, 50)">
    <circle cx="30" cy="30" r="28" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <polygon points="30,12 36,24 50,24 38,34 43,47 30,38 17,47 22,34 10,24 24,24" fill="#fbbf24" />
  </g>

  <!-- Organization Headers -->
  <text x="400" y="140" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3" font-family="system-ui">GOOGLE FOR DEVELOPERS &amp; AICTE EDUSKILLS</text>
  <text x="400" y="175" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui">CERTIFICATE OF INTERNSHIP COMPLETION</text>

  <!-- Recipient Section -->
  <text x="400" y="225" fill="#cbd5e1" font-size="14" text-anchor="middle" font-family="system-ui">This is to certify that</text>
  <text x="400" y="265" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui">RASHMITHA C</text>
  <line x1="250" y1="280" x2="550" y2="280" stroke="#334155" stroke-width="1.5" />

  <!-- Description -->
  <text x="400" y="315" fill="#cbd5e1" font-size="14" text-anchor="middle" font-family="system-ui">has successfully completed the 10-week virtual internship in</text>
  <text x="400" y="345" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle" font-family="system-ui">ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING</text>
  <text x="400" y="375" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui">Covering Deep Learning, Neural Networks, Computer Vision, and Predictive Modeling with TensorFlow.</text>

  <!-- Verification and Status -->
  <g transform="translate(100, 420)">
    <text x="0" y="20" fill="#64748b" font-size="11" font-family="monospace">Issued: 2024</text>
    <text x="0" y="40" fill="#64748b" font-size="11" font-family="monospace">Status: Verified Academic Program</text>
  </g>

  <g transform="translate(520, 420)">
    <rect width="180" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="22" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui">VERIFIED CREDENTIAL</text>
  </g>
</svg>
