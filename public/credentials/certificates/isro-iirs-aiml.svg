  </defs>

  <rect width="800" height="550" fill="url(#isroBg)" rx="16" />
  <rect x="20" y="20" width="760" height="510" fill="none" stroke="url(#isroBlue)" stroke-width="2" rx="12" />
  <rect x="28" y="28" width="744" height="494" fill="none" stroke="#1e293b" stroke-width="1" rx="8" />

  <text x="400" y="105" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3" font-family="system-ui">INDIAN INSTITUTE OF REMOTE SENSING (IIRS) / ISRO</text>
  <text x="400" y="145" fill="#f8fafc" font-size="23" font-weight="800" text-anchor="middle" font-family="system-ui">OUTREACH PROGRAMME CERTIFICATE</text>

