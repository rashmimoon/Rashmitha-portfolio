      <stop offset="100%" stop-color="#030b14" />
    </linearGradient>
    <linearGradient id="isroBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
