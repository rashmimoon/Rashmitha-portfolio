<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="docBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#docBg)" rx="14" stroke="#334155" stroke-width="2" />
  
  <!-- Redaction Security Banner -->
  <rect x="0" y="0" width="800" height="42" fill="#78350f" rx="14" />
  <rect x="0" y="28" width="800" height="14" fill="#78350f" />
  <text x="400" y="26" fill="#fef08a" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">
    🔒 REDACTED FOR PUBLIC DISPLAY — SENSITIVE PII, STIPEND &amp; SIGNATURES PROTECTED
  </text>

  <!-- Letter Content Header -->
  <g transform="translate(60, 70)">
    <text x="0" y="24" fill="#6366f1" font-size="16" font-weight="800" font-family="system-ui">TECHNOLOGY PARTNER SOLUTIONS</text>
    <text x="0" y="44" fill="#94a3b8" font-size="11" font-family="system-ui">Human Resources &amp; Talent Acquisition Division</text>
    
    <text x="520" y="24" fill="#cbd5e1" font-size="12" font-family="monospace">DATE: 2024</text>
    <text x="520" y="44" fill="#cbd5e1" font-size="12" font-family="monospace">REF: APPT-AI/2024</text>

    <!-- Line divider -->
    <line x1="0" y1="65" x2="680" y2="65" stroke="#334155" stroke-width="1.5" />

    <!-- Candidate Info with explicit privacy redaction blocks -->
    <text x="0" y="100" fill="#94a3b8" font-size="12" font-family="system-ui">TO:</text>
    <text x="35" y="100" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui">Rashmitha C</text>

    <text x="0" y="125" fill="#94a3b8" font-size="11" font-family="system-ui">Address:</text>
    <rect x="60" y="114" width="220" height="15" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
    <text x="70" y="125" fill="#64748b" font-size="10" font-family="monospace">[REDACTED: PRIVATE ADDRESS]</text>

    <text x="0" y="150" fill="#94a3b8" font-size="11" font-family="system-ui">Phone / ID:</text>
    <rect x="65" y="139" width="160" height="15" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
    <text x="75" y="150" fill="#64748b" font-size="10" font-family="monospace">[REDACTED: PHONE NUMBER]</text>

    <!-- Letter Body -->
    <text x="0" y="195" fill="#38bdf8" font-size="14" font-weight="700" font-family="system-ui">Subject: Offer of Internship Selection — Generative AI / Machine Learning</text>

    <text x="0" y="230" fill="#cbd5e1" font-size="12" font-family="system-ui">Dear Rashmitha,</text>
    <text x="0" y="258" fill="#cbd5e1" font-size="12" font-family="system-ui">Following your technical evaluation and academic project assessment, we are pleased</text>
    <text x="0" y="278" fill="#cbd5e1" font-size="12" font-family="system-ui">to extend this offer of Internship Selection for the role of</text>
    <text x="0" y="302" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui">AI / Machine Learning Engineering Trainee.</text>

    <!-- Terms with Redaction -->
    <text x="0" y="338" fill="#94a3b8" font-size="12" font-family="system-ui">Terms and Compensation:</text>
    <rect x="0" y="348" width="460" height="16" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
    <text x="10" y="360" fill="#64748b" font-size="10" font-family="monospace">[CONFIDENTIAL COMPENSATION CLAUSE REDACTED]</text>

    <!-- Status & Authorization -->
    <g transform="translate(0, 395)">
      <rect width="180" height="34" rx="6" fill="#132719" stroke="#16a34a" stroke-width="1.5" />
      <text x="90" y="22" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui">OFFICIAL SELECTION OFFER</text>

      <!-- Signature Redaction -->
      <g transform="translate(450, 0)">
        <rect width="180" height="30" rx="3" fill="#000000" stroke="#334155" stroke-width="1" />
        <text x="25" y="19" fill="#64748b" font-size="10" font-family="monospace">[AUTHORIZED SIGNATURE]</text>
        <text x="0" y="46" fill="#94a3b8" font-size="10" font-family="system-ui">Authorized Signatory / Talent HR</text>
      </g>
    </g>

    <!-- Bottom Notice -->
    <g transform="translate(0, 470)">
      <text x="0" y="0" fill="#94a3b8" font-size="10" font-style="italic" font-family="system-ui">
        *Recruiter Notice: This document verifies candidate selection and appointment offer. Original document preserved in secure private archive.
      </text>
    </g>
  </g>
</svg>
