<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#6366f1" opacity="0.12" filter="blur(20px)" />

  <!-- Outer Ring Accent -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 4" />

  <!-- Shoulders & Blazer -->
  <path d="M90 380 C 110 300, 150 280, 200 280 C 250 280, 290 300, 310 380 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Inner Blouse / Shirt Collar -->
  <path d="M165 280 L200 330 L235 280 Z" fill="#e2e8f0" />
  <path d="M185 280 L200 315 L215 280 Z" fill="#6366f1" opacity="0.4" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="70" rx="8" fill="#fcd34d" />
  <path d="M180 250 Q200 270 220 250 Z" fill="#f59e0b" opacity="0.4" />

  <!-- Hair Back -->
  <path d="M130 180 Q120 290 170 310 Q200 315 230 310 Q280 290 270 180 Z" fill="url(#hairGrad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fed7aa" />

  <!-- Hair Front Styling -->
  <path d="M142 165 C 145 105, 255 105, 258 165 C 240 135, 160 135, 142 165 Z" fill="url(#hairGrad)" />
  <path d="M145 160 C 170 145, 185 140, 200 160 C 215 140, 230 145, 255 160 C 248 115, 152 115, 145 160 Z" fill="url(#hairGrad)" />

  <!-- Eyebrows -->
  <path d="M165 160 Q175 156 186 161" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M214 161 Q225 156 235 160" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="176" cy="172" rx="4.5" ry="5.5" fill="#18181b" />
  <ellipse cx="224" cy="172" rx="4.5" ry="5.5" fill="#18181b" />
  <circle cx="178" cy="170" r="1.5" fill="#ffffff" />
  <circle cx="226" cy="170" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M200 175 L197 192 L203 192" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Gentle Smile -->
  <path d="M185 208 Q200 220 215 208" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glasses / Minimalist frames (Optional, clean tech look) -->
  <rect x="158" y="162" width="34" height="22" rx="6" fill="none" stroke="#6366f1" stroke-width="1.8" />
  <rect x="208" y="162" width="34" height="22" rx="6" fill="none" stroke="#6366f1" stroke-width="1.8" />
  <line x1="192" y1="172" x2="208" y2="172" stroke="#6366f1" stroke-width="1.8" />

  <!-- Tech Badge on Avatar Corner -->
  <g transform="translate(285, 305)">
    <circle cx="25" cy="25" r="25" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <path d="M20 16 L30 16 L33 24 L25 34 L17 24 Z" fill="url(#accentGrad)" />
  </g>
</svg>
