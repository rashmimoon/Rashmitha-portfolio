<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ragBg)" rx="14" stroke="#1e293b" stroke-width="2" />
  <circle cx="400" cy="225" r="180" fill="#06b6d4" opacity="0.06" filter="blur(30px)" />

  <text x="50" y="70" fill="#f8fafc" font-size="22" font-weight="700" font-family="system-ui">Enterprise RAG Document Intelligence</text>
  <text x="50" y="98" fill="#94a3b8" font-size="13" font-family="system-ui">Semantic Chunking • Dense Vector Search • Citations with Page-Level Grounding</text>

  <!-- Left Card: Ingestion Pipeline -->
  <g transform="translate(50, 130)">
    <rect width="320" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="35" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui">Document Ingestion &amp; Indexing</text>
    
    <rect x="20" y="55" width="280" height="45" rx="6" fill="#1e293b" />
    <text x="32" y="78" fill="#e2e8f0" font-size="11" font-family="system-ui">1. Multi-Page PDF Parser (PyPDF)</text>
    <text x="32" y="92" fill="#94a3b8" font-size="10" font-family="system-ui">Preserves section metadata &amp; tables</text>

    <rect x="20" y="115" width="280" height="45" rx="6" fill="#1e293b" />
    <text x="32" y="138" fill="#e2e8f0" font-size="11" font-family="system-ui">2. Recursive Character Splitter</text>
    <text x="32" y="152" fill="#94a3b8" font-size="10" font-family="system-ui">500 tokens with 75 token sliding overlap</text>

    <rect x="20" y="175" width="280" height="45" rx="6" fill="#1e293b" />
    <text x="32" y="198" fill="#e2e8f0" font-size="11" font-family="system-ui">3. Vector Generation (BGE-Large / OpenAI)</text>
    <text x="32" y="212" fill="#94a3b8" font-size="10" font-family="system-ui">Indexed in ChromaDB HNSW collection</text>
  </g>

  <!-- Right Card: Grounded Answer with Citations -->
  <g transform="translate(420, 130)">
    <rect width="330" height="260" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="35" fill="#4ade80" font-size="13" font-weight="600" font-family="system-ui">Verified Grounded Response</text>
    
    <rect x="20" y="55" width="290" height="135" rx="6" fill="#131e33" />
    <text x="32" y="80" fill="#cbd5e1" font-size="11" font-family="system-ui">"According to Section 4.1 of the specification,</text>
    <text x="32" y="98" fill="#cbd5e1" font-size="11" font-family="system-ui">model latency is constrained below 850ms by</text>
    <text x="32" y="116" fill="#cbd5e1" font-size="11" font-family="system-ui">pre-computing embeddings during ingestion."</text>
    
    <!-- Citation Chips -->
    <rect x="32" y="140" width="115" height="24" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="44" y="156" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui">Source: Doc-A (p.14)</text>

    <rect x="155" y="140" width="120" height="24" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
    <text x="167" y="156" fill="#38bdf8" font-size="10" font-weight="600" font-family="system-ui">Confidence: 94.2%</text>

    <!-- Evaluation metric -->
    <text x="20" y="215" fill="#a5b4fc" font-size="11" font-family="system-ui">Groundedness Score: 0.96 / 1.00</text>
    <text x="20" y="235" fill="#94a3b8" font-size="10" font-style="italic" font-family="system-ui">Zero hallucinations detected across benchmark query suite.</text>
  </g>
</svg>
