<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="badgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Hexagonal / Shield Outer Contour -->
  <polygon points="200,20 360,110 360,290 200,380 40,290 40,110" fill="url(#badgeBg)" stroke="url(#badgeRing)" stroke-width="4" />
  
  <polygon points="200,35 345,118 345,282 200,365 55,282 55,118" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Center Emblem -->
  <circle cx="200" cy="180" r="70" fill="#1e293b" stroke="#ff9900" stroke-width="2" />

  <!-- AWS Wave / Sparkle Icon -->
  <path d="M165 180 Q200 145 235 180 Q200 215 165 180 Z" fill="#ff9900" />
  <circle cx="200" cy="180" r="12" fill="#ffffff" />
  
  <polygon points="200,120 205,135 220,140 205,145 200,160 195,145 180,140 195,135" fill="#f43f5e" />

  <!-- Badge Text -->
  <text x="200" y="280" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" font-family="system-ui">AWS GENERATIVE AI</text>
  <text x="200" y="302" fill="#ff9900" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2" font-family="system-ui">FOUNDATIONS</text>
  <text x="200" y="325" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">VERIFIED DIGITAL CREDENTIAL</text>
</svg>
